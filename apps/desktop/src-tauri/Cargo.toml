[package]
name = "flight-finder-desktop"
version = "0.15.0"
description = "Flight Finder desktop launcher"
authors = ["Flight Finder"]
edition = "2021"
rust-version = "1.77.2"

# The library that main.rs calls into (also the entry point for mobile targets).
[lib]
name = "flight_finder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18"

[patch.crates-io]
glib = { git = "https://github.com/affromero/gtk-rs-core", rev = "b4765c59e519d89809e7df0301726b790e258222" }
glib-macros = { git = "https://github.com/affromero/gtk-rs-core", rev = "b4765c59e519d89809e7df0301726b790e258222" }
gtk3-macros = { git = "https://github.com/affromero/gtk3-rs", rev = "3911b26fe97f48de74fd0df48225e14a387a5b99" }

[features]
# Enables Tauri's custom-protocol asset serving in release builds.
custom-protocol = ["tauri/custom-protocol"]
