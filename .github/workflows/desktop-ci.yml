name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: npm install
        working-directory: apps/desktop
      - run: npm run icon
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri
      - name: Verify optimized GLib string iteration
        if: runner.os == 'Linux'
        run: cargo test --locked --release --test glib_variant
        working-directory: apps/desktop/src-tauri
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'Linux'
        with:
          python-version: '3.11'
      - name: Verify maintained GTK template macros
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri
        run: |
          cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/desktop-metadata.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import tomllib

          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          metadata = json.loads((temporary / 'desktop-metadata.json').read_text())
          patches = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['patch']['crates-io']
          macro = next(package for package in metadata['packages'] if package['name'] == 'gtk3-macros')
          assert macro['source'].endswith('#' + patches['gtk3-macros']['rev']), macro['source']
          shutil.copytree(pathlib.Path(macro['manifest_path']).parent, temporary / 'gtk3-macros-tests')
          shutil.copyfile('Cargo.lock', temporary / 'gtk3-macros-tests' / 'Cargo.lock')
          entries = ['[patch.crates-io]']
          for name, source in patches.items():
              fields = ', '.join(f'{key} = {json.dumps(value)}' for key, value in source.items())
              entries.append(f'{name} = {{ {fields} }}')
          (temporary / 'gtk-macro-patches.toml').write_text('\n'.join(entries) + '\n')
          PY
          cargo metadata --format-version 1 --filter-platform x86_64-unknown-linux-gnu \
            --manifest-path "$RUNNER_TEMP/gtk3-macros-tests/Cargo.toml" \
            --config "$RUNNER_TEMP/gtk-macro-patches.toml" > "$RUNNER_TEMP/gtk-macro-metadata.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import tomllib

          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          consumer = json.loads((temporary / 'desktop-metadata.json').read_text())['packages']
          isolated = json.loads((temporary / 'gtk-macro-metadata.json').read_text())['packages']
          patches = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['patch']['crates-io']
          for name, patch in patches.items():
              expected = f"git+{patch['git']}?rev={patch['rev']}#{patch['rev']}"
              assert any(package['name'] == name and package['source'] == expected for package in isolated), name
          expected_gtk = next(package['version'] for package in consumer if package['name'] == 'gtk')
          assert {package['version'] for package in isolated if package['name'] == 'gtk'} == {expected_gtk}
          PY
          xvfb-run -a cargo test --locked \
            --manifest-path "$RUNNER_TEMP/gtk3-macros-tests/Cargo.toml" \
            --config "$RUNNER_TEMP/gtk-macro-patches.toml"

  cli-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test --workspace=@flight-finder/cli
      - run: npm run build --workspace=@flight-finder/cli
      - name: Verify source CLI startup without deprecated loader hooks
        run: |
          node --throw-deprecation --import tsx --import ./packages/cli/register.mjs packages/cli/src/index.tsx --headless --help
          node --throw-deprecation --import tsx --import ./packages/cli/register.mjs --input-type=module -e "await import('@/lib/flight-pricing'); await import('@/generated/prisma/client.ts')"
