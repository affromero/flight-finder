name: Desktop Release

# Builds the Tauri desktop launcher for macOS, Windows, and Linux and attaches
# the installers to a GitHub Release. Triggered by a `desktop-v*` tag so it never
# collides with the `vX.Y.Z` tags that drive the web/GHCR release.
#
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0

on:
  push:
    tags:
      - 'desktop-v*'
  # Also build on a published GitHub release, so one release ships the web image
  # (docker.yml) and the desktop installers together. Deploys (SSH) don't trigger
  # this -- only releases do, since a 3-OS build + sign is too heavy per deploy.
  release:
    types: [published]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/github-script@v9
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { requireChecks, requireRelease } = require('./scripts/docker-publication.cjs');
            const sha = await requireRelease({ github, owner, repo, tag: process.env.RELEASE_TAG });
            await requireChecks({ github, owner, repo, sha });
            core.setOutput('sha', sha);

  build:
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./apps/desktop/src-tauri -> target

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Install launcher deps and generate icons
        working-directory: apps/desktop
        run: |
          npm install
          npm run icon

      - name: Remove installers from previous cached builds
        working-directory: apps/desktop
        run: >-
          node -e "const fs = require('node:fs'), path = require('node:path');
          function clean(dir) { if (!fs.existsSync(dir)) return;
          for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
          if (!entry.isDirectory()) continue; const child = path.join(dir, entry.name);
          if (entry.name === 'bundle') fs.rmSync(child, {recursive:true}); else clean(child); } }
          clean('src-tauri/target');"

      - name: Build native installers without publishing
        uses: tauri-apps/tauri-action@v1.0.0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/bundle/**/*.rpm
            apps/desktop/src-tauri/target/**/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/bundle/**/*.tar.gz
            apps/desktop/src-tauri/target/**/bundle/**/*.sig

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: /tmp/desktop-installers
      - name: Verify commit and publish installers
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ needs.verify.outputs.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        with:
          script: |
            await require('./scripts/desktop-publication.cjs').publishDesktop({ github, ...context.repo,
              sha: process.env.HEAD_SHA, tag: process.env.RELEASE_TAG, directory: '/tmp/desktop-installers' });
