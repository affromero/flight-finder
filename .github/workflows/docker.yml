name: Docker

on:
  workflow_run:
    workflows: [CI, Car and shared travel workflows, Hotel integration, Desktop CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag/branch/sha) to build from
        required: true
        default: main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: affromero/flight-finder
  # Stop docker/build-push-action uploading a *.dockerbuild record as an artifact on every run.
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false

jobs:
  resolve:
    if: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - id: commit
        uses: actions/github-script@v9
        env:
          BUILD_REF: ${{ inputs.ref || github.event.release.tag_name || github.event.workflow_run.head_sha || github.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.repos.getCommit({ owner, repo, ref: process.env.BUILD_REF });
            await require('./scripts/docker-publication.cjs').requireChecks({ github, owner, repo, sha: data.sha });
            core.setOutput('sha', data.sha);

  build:
    needs: resolve
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            COMMIT_SHA=${{ needs.resolve.outputs.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    concurrency:
      group: flight-finder-image-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}

      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Create multi-arch manifest
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.HEAD_SHA;
            await require('./scripts/docker-publication.cjs').requireChecks({ github, owner, repo, sha, attempts: 1 });
            const { data } = await github.rest.repos.getContent({ owner, repo, path: 'apps/web/package.json', ref: sha });
            const { version } = JSON.parse(Buffer.from(data.content, 'base64').toString());
            const digests = require('node:fs').readdirSync('/tmp/digests').map(value => `sha256:${value}`);
            await require('./scripts/docker-publication.cjs').publish({ github, owner, repo, sha,
              image: `${process.env.REGISTRY}/${process.env.IMAGE_NAME}`, digests,
              releaseTag: process.env.RELEASE_TAG, version });

      - name: Verify manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.sha }}
