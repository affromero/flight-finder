name: Dead code
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dead-code-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dead-code:
    name: Dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: affromero/repo-maintenance@2f2540e9565b4f3df3de6ad70a28ad18dec0ca66 # v1.0.5
        with:
          rust-paths: 'apps/desktop/src-tauri'
          prepare: 'npx prisma generate --schema=apps/web/prisma/schema.prisma'
